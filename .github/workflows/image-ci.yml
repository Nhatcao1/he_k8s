name: Build and promote HE image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/image-ci.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "api/**"
      - "client/**"
      - "encryptor/**"
      - "tests/**"
      - "scripts/set_image.py"
      - "deploy/k8s/**"
      - "!deploy/k8s/kustomization.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: he-image-main
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: docker.io/dockerboi99/he_k8s

jobs:
  build-push-promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dependency-free contract tests
        run: python -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable and testing tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote immutable image tag for Argo CD
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          python scripts/set_image.py \
            --repository dockerboi99/he_k8s \
            --tag "$IMAGE_TAG"
          if git diff --quiet -- deploy/k8s/kustomization.yaml; then
            echo "GitOps image tag is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "Deploy dockerboi99/he_k8s:$IMAGE_TAG [skip ci]"
          git push origin HEAD:main
