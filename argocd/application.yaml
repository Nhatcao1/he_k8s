apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datalake-he
  namespace: datalake-he
spec:
  project: datalake
  source:
    repoURL: http://source.cyberspace.vn/nhatcm1/he_k8s.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: datalake-he
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
