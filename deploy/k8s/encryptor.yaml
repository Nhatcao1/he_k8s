# Staged but intentionally not listed in kustomization.yaml yet.
# Activate only after an image containing the encryptor package is published.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: he-encryptor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: he-encryptor
  template:
    metadata:
      labels:
        app: he-encryptor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: encryptor
          image: docker.io/dockerboi99/he_k8s:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - encryptor.app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MAX_VECTOR_LENGTH
              value: "64"
            - name: MAX_SESSIONS
              value: "32"
            - name: SESSION_TTL_SECONDS
              value: "900"
            - name: MAX_REQUEST_BYTES
              value: "50331648" # 48 MiB
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: he-encryptor
spec:
  selector:
    app: he-encryptor
  ports:
    - name: http
      port: 8080
      targetPort: http
